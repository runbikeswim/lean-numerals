name = "lean-numerals"
version = "0.2.0"
defaultTargets = ["lean-numerals"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
autoImplicit = false
relaxedAutoImplicit = false
maxSynthPendingDepth = 3
pp.proofs = true

[[lean_lib]]
name = "Numerals"

[[lean_exe]]
name = "lean-numerals"
root = "Main"

[[require]]
name = "checkdecls"
git = "https://github.com/PatrickMassot/checkdecls.git"

[[require]]
name = "«doc-gen4»"
git = "https://github.com/leanprover/doc-gen4"
rev = "main"
